<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play | Mark Paulo Realin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#060b24; --navy:#0b1338; --panel:#121c4d; --line:#22317d;
  --violet:#6d5bf7; --cyan:#5cd6ff; --ice:#e8eeff; --muted:#a3b3e6;
  --vn:#c792ff; --rpg:#ffb86b; --simple:#6fd3ff;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;color:var(--ice);font:400 .95rem/1.6 var(--body);background-color:#0a1236;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

header{background:var(--ink);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:54px}
.logo{font:800 1.1rem var(--display);text-decoration:none;letter-spacing:-.01em}
.back{text-decoration:none;color:var(--muted);font-weight:500;padding:5px 12px;border-radius:999px}
.back:hover{color:#fff;background:rgba(255,255,255,.12)}

main{padding:26px 0 50px}
h1{font:800 1.6rem var(--display);letter-spacing:-.015em}
.tag{display:inline-block;font-size:.78rem;font-weight:600;color:var(--tag);border:1px solid var(--tag);border-radius:999px;padding:0 10px;margin-left:10px;vertical-align:middle}
.vn{--c1:#4a2fb5;--tag:var(--vn)}
.rpg{--c1:#a2492a;--tag:var(--rpg)}
.simple{--c1:#1d5fb8;--tag:var(--simple)}

/* game frame */
.frame{position:relative;width:100%;max-width:960px;margin:18px auto 0;background:#000;border:1px solid var(--line);
  border-radius:12px 12px 0 0;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.launch{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;background:var(--c1);text-align:center;padding:20px}
.launch strong{font:800 clamp(1.4rem,4vw,2.4rem) var(--display);letter-spacing:-.02em}
.launch[hidden]{display:none}
.bar{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--navy);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:10px 14px}
.gt{font:800 1rem var(--display)}
.frame:fullscreen{max-width:none;border:0;border-radius:0;margin:0}

.btn{font:600 .9rem var(--body);text-decoration:none;border-radius:10px;padding:8px 15px;border:1px solid var(--cyan);cursor:pointer;color:var(--ink);background:var(--cyan)}
.btn:hover{background:#8be3ff;border-color:#8be3ff}
.btn.big{font-size:1.05rem;padding:12px 28px}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn.ghost:hover{background:rgba(255,255,255,.14);border-color:#fff}

/* info */
.info{max-width:960px;margin:26px auto 0;display:grid;grid-template-columns:2fr 1fr;gap:20px}
.box{background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.box h2{font:800 1.05rem var(--display);margin-bottom:6px}
.box p{color:var(--muted)}
.more a{display:block;text-decoration:none;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--line)}
.more a:last-child{border:0}
.more a:hover{color:#fff}
.missing{max-width:960px;margin:40px auto;text-align:center}
.missing p{color:var(--muted);margin:8px 0 18px}
@media (max-width:760px){.info{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="index.html">Mark Paulo Realin</a>
    <a class="back" href="index.html#games">&larr; Back to all games</a>
  </div>
</header>

<main class="wrap" id="app"></main>

<script src="games.js"></script>
<script>
const LABEL = {vn:"Visual novel", rpg:"RPG", simple:"Simple game"};
const app = document.getElementById("app");
const slug = new URLSearchParams(location.search).get("game");
const g = GAMES.find(x => x.slug === slug);

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

if (!g){
  document.title = "Game not found | Mark Paulo Realin";
  const m = el("div", "missing");
  m.append(el("h1", "", "Game not found"),
           el("p", "", "That link doesn't match any game. Pick one from the list instead."));
  const a = el("a", "btn", "Back to all games"); a.href = "index.html#games";
  m.append(a); app.append(m);
} else {
  document.title = g.title + " | Mark Paulo Realin";

  const h = el("h1", "", g.title);
  const t = el("span", "tag " + g.genre, LABEL[g.genre]);
  h.append(t);

  const frame = el("div", "frame " + g.genre);
  frame.style.aspectRatio = (g.width || 960) + " / " + (g.height || 540);
  const launch = el("div", "launch");
  const run = el("button", "btn big", "Run game");
  launch.append(el("strong", "", g.title), run);
  frame.append(launch);

  const bar = el("div", "bar");
  const fs = el("button", "btn ghost", "Fullscreen");
  bar.append(el("div", "gt", g.title), fs);

  function start(){
    if (frame.querySelector("iframe")) return;
    const f = document.createElement("iframe");
    f.src = "games/" + encodeURIComponent(g.slug) + "/";
    f.title = g.title;
    f.allow = "fullscreen; autoplay; gamepad";
    f.setAttribute("allowfullscreen", "");
    frame.append(f);
    launch.hidden = true;
    f.addEventListener("load", () => f.focus());
  }
  run.onclick = start;
  fs.onclick = () => {
    start();
    if (frame.requestFullscreen) frame.requestFullscreen();
  };

  const info = el("div", "info");
  const about = el("div", "box");
  about.append(el("h2", "", "About this game"), el("p", "", g.desc || g.short));
  if (g.controls){
    const c = el("p", "", g.controls); c.style.marginTop = "10px";
    about.append(el("h2", "", "Controls"), c);
    about.lastChild.previousSibling.style.marginTop = "14px";
  }
  const more = el("div", "box more");
  more.append(el("h2", "", "More games"));
  GAMES.filter(x => x.slug !== g.slug).forEach(x => {
    const a = el("a", "", x.title);
    a.href = "play.html?game=" + encodeURIComponent(x.slug);
    more.append(a);
  });
  info.append(about, more);

  app.append(h, frame, bar, info);
}
</script>
</body>
</html>
